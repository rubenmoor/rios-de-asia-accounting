<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}rios-de-asia-accounting{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #222; background: #fafafa; }
    nav { background: #264653; padding: .5rem 1rem; display: flex; align-items: center; }
    nav form { margin-left: auto; }
    nav button { margin: 0; padding: .1rem .6rem; }
    nav a { color: #eee; margin-right: 1rem; text-decoration: none; }
    nav a.active { font-weight: bold; border-bottom: 2px solid #e9c46a; }
    main { max-width: 64rem; margin: 1rem auto; padding: 0 1rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { padding: .3rem .6rem; border-bottom: 1px solid #ddd; text-align: left; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    label { display: block; margin-top: .6rem; font-weight: 600; }
    input, select, textarea { font: inherit; padding: .25rem; }
    .hint { color: #666; font-size: .85rem; font-weight: normal; }
    .error { color: #b00020; font-size: .9rem; }
    .flash { padding: .5rem .8rem; margin: .5rem 0; border-radius: 4px; background: #e3f2e1; }
    .flash.warning { background: #fff3cd; }
    .flash.error { background: #f8d7da; color: #721c24; }
    button, .button { font: inherit; padding: .3rem .8rem; margin-top: .8rem; cursor: pointer; }
    button.danger { color: #b00020; }
  </style>
</head>
<body>
  <nav>
    {% for endpoint, url, label in nav %}
    <a href="{{ url }}"{% if active == endpoint %} class="active"{% endif %}>{{ label }}</a>
    {% endfor %}
    <form method="post" action="/quit"><button type="submit">Quit</button></form>
  </nav>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
    <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
