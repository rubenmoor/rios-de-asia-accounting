[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "rios-de-asia-accounting"
version = "0.1.0"
description = "Local bookkeeping for Airbnb rentals"
requires-python = ">=3.11"
dependencies = ["flask", "waitress"]

[project.scripts]
rios-de-asia-accounting = "rios_de_asia_accounting.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rios_de_asia_accounting = ["web/dist/**/*", "storage/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
